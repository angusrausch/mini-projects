<html>
    <body>
        <h1>
            {{log.name}}
        </h1>
        <div style="display: flex; align-items: center;">
            <span style="flex: 1; text-align: left;">
                <a href="{{back_path}}">Back</a>
            </span>
        </div>
        <div style="width: 100%; text-align: center;">
            <span id="error" style="color: red; font-size: 1.5em; font-weight: bold;">
            </span>
        </div>
        <br><br>
        <div id="logs">
        </div>
    </body>
</html>

<script>
    remoteHost = window.location.host;
    remotePath = window.location.pathname;
    remoteProtocol = window.location.protocol;
    remoteLocation = remoteProtocol + "//" + remoteHost + "/api" + remotePath;

    async function loadUpdates() {
        try {
            const response = await fetch(remoteLocation, {
                method: "GET",
                headers: {
                    'Content-Type': 'application/json',
                }
            });
            if (response.ok) {
                return response.json();
            } else if (response.status === 404) {
                document.getElementById("error").innerHTML = "File not found";
                return -1;
            } else if (response.status === 500) {
                document.getElementById("error").innerHTML = "Malformed GZIP file detected";
                return -1;
            }
        } catch (error) {
            console.error("Error loading values:", error);
            document.getElementById("error").innerHTML = "Error fetching updated data";
        }
    }

    async function updatePage() {
        let updatedLogs = await loadUpdates();

        if (updatedLogs === -1) {
            return;
        }

        let updatedHtml = String();

        updatedLogs.contents.forEach(function (logLine) {
            updatedHtml += `
<span style="padding: 5px;">
    ${logLine}
</span><br>`;
        });

        document.getElementById("logs").innerHTML = updatedHtml;
    }




    window.addEventListener('load', function () {
        updatePage();
        setInterval(updatePage, 10000);
    });


</script>
